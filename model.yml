seed: 1
randomNumbersLimit: 100000
queues:
  Nivel1:
    servers: 1
    capacity: 15
    minArrival: 5.0
    maxArrival: 10.0
    minService: 4.0
    maxService: 8.0
  Nivel2:
    servers: 2
    capacity: 20
    minService: 10.0
    maxService: 20.0
  Laboratorio:
    servers: 1
    capacity: 10
    minService: 20.0
    maxService: 40.0
arrivals:
  queue: Nivel1
  firstTime: 2.0
network:
  - {source: Nivel1, target: null, probability: 0.6}
  - {source: Nivel1, target: Nivel2, probability: 0.4}
  - {source: Nivel2, target: null, probability: 0.7}
  - {source: Nivel2, target: Laboratorio, probability: 0.3}
  - {source: Laboratorio, target: Nivel2, probability: 1.0}
